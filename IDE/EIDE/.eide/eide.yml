version: "4.1"
name: CH32V006
type: RISC-V
deviceName: null
packDir: null
srcDirs:
  - ../../Src
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 263fb117b5a905bbc8993edf3058b75d
targets:
  obj:
    cppPreprocessAttrs:
      defineList: []
      incList:
        - ../../Src/Core
        - ../../Src/Debug
        - ../../Src/Peripheral/inc
        - ../../Src
        - ../../Src/BSP/inc
      libList: []
    excludeList:
      - Startup
      - Peripheral
      - Ld
      - Debug
      - Core
    settings:
      debugger: cortex-debug
    toolchain: RISCV_GCC
    toolchainConfigMap:
      RISCV_GCC:
        linkerScriptPath: ""
        options:
          version: 2
          afterBuildTasks:
            - name: elf_to_lst
              abortAfterFailed: false
              command: bash elf_to_lst.sh
              disable: true
          asm-compiler:
            ASM_FLAGS: -Wl,-Bstatic
          beforeBuildTasks: []
          c/cpp-compiler:
            C_FLAGS: -Wl,-Bstatic
            language-c: gnu99
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-size
            warnings: all-warnings
          global:
            abi: ilp32e
            arch: rv32ec
            code-model: medlow
            misc-control: -fmessage-length=0 -fsigned-char -ffunction-sections -fdata-sections -Wunused -Wuninitialized --specs=nano.specs --specs=nosys.specs
            output-debug-info: enable
          linker:
            $toolName: auto
            LD_FLAGS: -Xlinker --gc-sections -nostartfiles -T "../../Src/Ld/Link.ld"
            LIB_FLAGS: -lprintfloat -lm
            output-format: elf
            remove-unused-input-sections: true
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: download.bat "${programFile}"
        eraseChipCommand: ""
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: Custom
